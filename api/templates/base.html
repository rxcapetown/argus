<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus — {% block title %}Trade Exception Corpus{% endblock %}</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:1080px;margin:0 auto;padding:1.2rem;color:#1a1a1a;background:#fafafa}
nav{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem;border-bottom:2px solid #1a1a1a;padding-bottom:.7rem}
nav a{color:#1a1a1a;text-decoration:none;font-weight:600}
nav a:hover{text-decoration:underline}
.brand{font-weight:800;font-size:1.25rem;margin-right:auto}
a.brand{text-decoration:none;color:inherit}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:4px;vertical-align:middle}
.badge.synth{background:#fff3cd;color:#7a5b00;border:1px solid #e0c36a}
.badge.pub{background:#d4edda;color:#155724;border:1px solid #a3d4b0}
.badge.verified{background:#cce5ff;color:#004085;border:1px solid #8fc1f0}
.badge.prop{background:#f3e8ff;color:#5b21b6;border:1px solid #c4a7f5}
table{width:100%;border-collapse:collapse;margin:1rem 0;background:#fff}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid #e5e5e5;font-size:.9rem}
th{background:#f0f0f0}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:1rem;margin:1rem 0}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.panel ul{margin:.4rem 0;padding-left:1.2rem}
.timeline{list-style:none;padding:0}
.timeline li{padding:.45rem 0;border-left:3px solid #1a1a1a;padding-left:.8rem;margin-left:.3rem}
footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid #ccc;color:#666;font-size:.85rem}
form.inline{display:inline}
input,select,textarea{padding:.4rem;margin:.2rem;border:1px solid #ccc;border-radius:4px;font-size:.9rem}
button{padding:.45rem .9rem;background:#1a1a1a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:.9rem}
button:hover{background:#333}
pre{background:#f4f4f4;padding:.8rem;border-radius:6px;overflow-x:auto;font-size:.82rem}
.tag{font-size:.78rem;color:#555;background:#eee;border-radius:4px;padding:.1rem .45rem}
</style>
</head>
<body>
<nav>
<a class="brand" href="/">ARGUS</a>
<a href="/dossiers">Dossiers</a>
<a href="/taxonomy">Taxonomy</a>
<a href="/rulings">CBP Rulings</a>
<a href="/benchmarks">Benchmarks</a>
<a href="/story">Our story</a>
<a href="/redact">Contribute</a>
</nav>
{% block content %}{% endblock %}
<footer>{{ footer }}</footer>
</body>
</html>
